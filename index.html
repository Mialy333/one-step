<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un pas · One step</title>
<style>
  :root {
    --bg: #e9efed;
    --surface: #ffffff;
    --ink: #1f2a2e;
    --muted: #5f6f73;
    --accent: #2f6466;
    --line: #c9d6d3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .lang { display: flex; justify-content: flex-end; gap: .25rem; margin-bottom: 1.5rem; }
  .lang button { padding: .25rem .8rem; font-size: .9rem; background: transparent; color: var(--muted); border-color: var(--line); }
  .lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--accent); }
  h1 { font-size: 2.25rem; line-height: 1.1; margin: 0 0 .5rem; font-weight: 700; }
  .intro { color: var(--muted); margin: 0 0 2rem; }
  label { display: block; color: var(--muted); margin: 0 0 .5rem; }
  textarea {
    width: 100%; min-height: 11rem; padding: 1rem;
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; resize: vertical;
  }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; cursor: pointer; border-radius: 999px; padding: .7rem 1.4rem;
    border: 1px solid var(--accent);
  }
  .primary { background: var(--accent); color: #fff; margin-top: 1rem; }
  .secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  #status { color: var(--muted); font-size: .95rem; min-height: 1.6em; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  #result { margin-top: 2rem; }
  .now {
    background: var(--surface); border-radius: 16px; padding: 1.75rem 1.5rem;
    border-left: 6px solid var(--accent);
  }
  .now p { margin: 0; }
  .label { color: var(--muted); font-size: .95rem; }
  .now .action { font-size: 1.6rem; line-height: 1.3; font-weight: 600; margin: .35rem 0 1.25rem; }
  .next { margin-top: 1.75rem; color: var(--muted); }
  .next p { margin: 0; }
  .next ul { margin: .25rem 0 0; padding-left: 1.2rem; }
  .rest { margin-top: 1.25rem; }
  .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.75rem; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .9rem; }
  #debug { font-size: .8rem; color: var(--muted); white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav class="lang" aria-label="Langue / Language">
    <button id="lang-fr" lang="fr" aria-pressed="true">FR</button>
    <button id="lang-en" lang="en" aria-pressed="false">EN</button>
  </nav>

  <h1 data-i18n="title"></h1>
  <p class="intro" data-i18n="intro"></p>

  <section id="input">
    <label for="dump" data-i18n="label"></label>
    <textarea id="dump"></textarea>
    <button id="go" class="primary" disabled data-i18n="go"></button>
    <p id="status"></p>
    <progress id="bar" max="1" value="0"></progress>
  </section>

  <section id="result" hidden aria-live="polite">
    <div class="now">
      <p class="label" data-i18n="nowLabel"></p>
      <p class="action" id="now"></p>
      <button id="smaller" class="secondary" data-i18n="smaller"></button>
    </div>
    <div class="next" id="nextBlock">
      <p class="label" data-i18n="nextLabel"></p>
      <ul id="next"></ul>
    </div>
    <p class="rest" data-i18n="rest"></p>
    <div class="actions">
      <button id="again" class="secondary" data-i18n="again"></button>
    </div>
  </section>

  <footer>
    <p data-i18n="privacy"></p>
    <p id="debug" hidden></p>
  </footer>
</main>

<script type="module">
const MODEL = "gemma-2-2b-it-q4f16_1-MLC";
const DEBUG = new URLSearchParams(location.search).has("debug");
const $ = (id) => document.getElementById(id);

// ---------- Textes de l'interface / UI copy ----------
const UI = {
  fr: {
    title: "Un pas",
    intro: "Écris tout ce qui te passe par la tête, dans le désordre. On en sort une seule chose à faire maintenant.",
    label: "Ce qui t'encombre",
    placeholder: "Pas besoin d'ordre, ni de phrases complètes.",
    go: "Trouver mon premier pas",
    nowLabel: "Maintenant, juste ça",
    smaller: "C'est encore trop gros",
    nextLabel: "Ensuite, quand tu veux",
    rest: "Le reste peut attendre.",
    again: "Recommencer",
    privacy: "Tout se passe sur cet ordinateur. Ce que tu écris n'est envoyé nulle part.",
    loading: "Préparation. La première fois, ça prend quelques minutes ; ensuite c'est immédiat.",
    noGpu: "Ce navigateur ne peut pas faire tourner l'outil. Ouvre cette page dans Chrome, sur ordinateur.",
    loadFail: "Le chargement a échoué. Recharge la page ; si ça recommence, ferme les autres onglets lourds.",
    empty: "Écris au moins une chose, même en vrac.",
    thinking: "Un instant…",
    retry: "Ça n'a pas marché cette fois. Réessaie.",
  },
  en: {
    title: "One step",
    intro: "Write down everything on your mind, in any order. We'll pull out one thing to do right now.",
    label: "What's weighing on you",
    placeholder: "No need for order or full sentences.",
    go: "Find my first step",
    nowLabel: "Right now, just this",
    smaller: "Still too big",
    nextLabel: "Next, whenever you're ready",
    rest: "Everything else can wait.",
    again: "Start over",
    privacy: "Everything happens on this computer. What you write is never sent anywhere.",
    loading: "Getting ready. The first time takes a few minutes; after that it's instant.",
    noGpu: "This browser can't run the tool. Open this page in Chrome on a computer.",
    loadFail: "Loading failed. Reload the page; if it happens again, close other heavy tabs.",
    empty: "Write at least one thing, even a messy one.",
    thinking: "One moment…",
    retry: "That didn't work this time. Try again.",
  },
};

// ---------- Consignes du modèle / model prompts ----------
const PROMPTS = {
  fr: {
    plan: `Tu aides une personne submergée à démarrer. Elle écrit son vrac mental.
Réponds en français.
Règles :
- Écris chaque action à l'infinitif, en commençant par le verbe.
- Prends les actions uniquement dans son vrac. N'invente aucune tâche, aucune décision, aucun conseil.
- "maintenant" : une seule action, la plus facile à lancer, faisable en 10 minutes maximum.
- "ensuite" : au plus 3 autres actions du vrac. Mets en priorité celles qui ont une date ou une échéance.
- Une action n'apparaît qu'une fois.

Exemple de vrac : "renouveler mon passeport il expire en mars, arroser les plantes, le rapport pour lundi, et faut que j'écrive à Tom pour le billet de train"
Exemple de réponse : {"maintenant":"Arroser les plantes","ensuite":["Terminer le rapport pour lundi","Écrire à Tom pour le billet de train","Renouveler le passeport avant mars"]}`,
    dumpLabel: "Vrac",
    step: (a) => `Une personne bloque devant cette action : "${a}".
Réponds en français. Donne la toute première étape, faisable en 2 minutes, très concrète.
Écris-la à l'infinitif, en commençant par le verbe. N'ajoute aucun conseil.
Exemple : pour "Terminer le rapport pour lundi", réponds {"etape":"Ouvrir le fichier du rapport"}.`,
  },
  en: {
    plan: `You help an overwhelmed person get started. They write down their messy thoughts.
Answer in English.
Rules:
- Write each action as a short imperative, starting with the verb.
- Only use actions from their list. Do not invent any task, decision or advice.
- "maintenant": one single action, the easiest to start, doable in 10 minutes or less.
- "ensuite": at most 3 other actions from the list. Prioritise those with a date or deadline.
- Each action appears only once.

Example list: "renew my passport it expires in March, water the plants, the report for Monday, and I need to text Tom about the train ticket"
Example answer: {"maintenant":"Water the plants","ensuite":["Finish the report for Monday","Text Tom about the train ticket","Renew the passport before March"]}`,
    dumpLabel: "List",
    step: (a) => `Someone is stuck in front of this action: "${a}".
Answer in English. Give the very first step, doable in 2 minutes, very concrete.
Write it as a short imperative, starting with the verb. Add no advice.
Example: for "Finish the report for Monday", answer {"etape":"Open the report file"}.`,
  },
};

const PLAN_SCHEMA = JSON.stringify({
  type: "object",
  properties: {
    maintenant: { type: "string" },
    ensuite: { type: "array", items: { type: "string" } },
  },
  required: ["maintenant", "ensuite"],
});

const STEP_SCHEMA = JSON.stringify({
  type: "object",
  properties: { etape: { type: "string" } },
  required: ["etape"],
});

// ---------- Langue / language ----------
function initialLang() {
  // Priorité : ?lang= dans l'URL, puis le dernier choix, puis la langue du navigateur
  const urlLang = new URLSearchParams(location.search).get("lang");
  if (urlLang === "fr" || urlLang === "en") return urlLang;
  try {
    const saved = localStorage.getItem("un-pas-lang");
    if (saved === "fr" || saved === "en") return saved;
  } catch {}
  return navigator.language?.startsWith("fr") ? "fr" : "en";
}

let lang = initialLang();
let statusKey = "loading";
const t = (key) => UI[lang][key];

function setStatus(key) {
  statusKey = key;
  $("status").textContent = key ? t(key) : "";
}

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $("dump").placeholder = t("placeholder");
  $("lang-fr").setAttribute("aria-pressed", String(lang === "fr"));
  $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  setStatus(statusKey);
}

function switchLang(next) {
  if (next === lang) return;
  lang = next;
  try { localStorage.setItem("un-pas-lang", lang); } catch {}
  applyLang();
  // Le résultat affiché était dans l'autre langue : on revient à la saisie
  // The result on screen was in the other language: go back to input
  if (!$("result").hidden) showInput();
}

$("lang-fr").onclick = () => switchLang("fr");
$("lang-en").onclick = () => switchLang("en");
applyLang();

// ---------- Modèle / model ----------
function debug(line) {
  if (!DEBUG) return;
  $("debug").hidden = false;
  $("debug").textContent += line + "\n";
}

async function ask(engine, prompt, schema) {
  const start = performance.now();
  const r = await engine.chat.completions.create({
    messages: [{ role: "user", content: prompt }],
    temperature: 0.3,
    max_tokens: 250,
    response_format: { type: "json_object", schema },
  });
  const tps = r.usage?.extra?.decode_tokens_per_s;
  debug(`${((performance.now() - start) / 1000).toFixed(1)} s, ${tps ? tps.toFixed(1) : "?"} tokens/s`);
  return JSON.parse(r.choices[0].message.content.replace(/```json|```/g, "").trim());
}

// Le moteur est chargé APRÈS l'affichage des textes : si le CDN est lent ou bloqué,
// la page reste lisible au lieu de rester blanche.
// The engine loads AFTER the copy is shown, so a slow or blocked CDN never blanks the page.
let CreateMLCEngine;
try {
  ({ CreateMLCEngine } = await import("https://esm.run/@mlc-ai/web-llm"));
} catch (err) {
  setStatus("loadFail");
  $("bar").hidden = true;
  console.error(err);
  throw err;
}

if (!navigator.gpu) {
  setStatus("noGpu");
  $("bar").hidden = true;
  throw new Error("WebGPU unavailable");
}

const t0 = performance.now();
let engine;
try {
  engine = await CreateMLCEngine(MODEL, {
    initProgressCallback: (p) => { $("bar").value = p.progress ?? 0; },
  });
} catch (err) {
  setStatus("loadFail");
  console.error(err);
  throw err;
}
debug(`Model ready in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
$("bar").hidden = true;
setStatus("");
$("go").disabled = false;

// ---------- Interactions ----------
function busy(on, key = "") {
  $("go").disabled = on;
  $("smaller").disabled = on;
  setStatus(key);
}

function showInput() {
  $("result").hidden = true;
  $("input").hidden = false;
  $("dump").focus();
}

$("go").onclick = async () => {
  const dump = $("dump").value.trim();
  if (!dump) { setStatus("empty"); return; }
  busy(true, "thinking");
  try {
    const p = PROMPTS[lang];
    const data = await ask(engine, `${p.plan}\n\n${p.dumpLabel}:\n${dump}`, PLAN_SCHEMA);
    const next = (Array.isArray(data.ensuite) ? data.ensuite : [])
      .filter((x) => x && x !== data.maintenant)
      .slice(0, 3);
    $("now").textContent = data.maintenant;
    $("next").replaceChildren(...next.map((x) => Object.assign(document.createElement("li"), { textContent: x })));
    $("nextBlock").hidden = next.length === 0;
    $("input").hidden = true;
    $("result").hidden = false;
    busy(false);
  } catch (err) {
    console.error(err);
    busy(false, "retry");
  }
};

$("smaller").onclick = async () => {
  busy(true);
  $("smaller").textContent = t("thinking");
  try {
    const data = await ask(engine, PROMPTS[lang].step($("now").textContent), STEP_SCHEMA);
    if (data.etape) $("now").textContent = data.etape;
  } catch (err) {
    console.error(err);
  } finally {
    busy(false);
    $("smaller").textContent = t("smaller");
  }
};

$("again").onclick = showInput;
</script>
</body>
</html>
